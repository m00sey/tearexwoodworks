# Tea Rex Woodworks: the whole site on one Cloudflare Worker.
#   static files from ../site  (assets binding)
#   /api/*                     quote form backend (D1 + email); legacy /submit, /admin, /health still work
# Deploy with: cd worker && npx wrangler deploy
#
# Secrets (set once with `npx wrangler secret put NAME`):
#   MAIL_TO            his inbox
#   ADMIN_PASS         password for /api/admin (user is ADMIN_USER below)
#   RESEND_API_KEY     resend.com key; used until Email Routing is live, and as fallback after
#   TURNSTILE_SECRET   optional; when set, submissions must carry a valid Turnstile token
name = "tearex-contact"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true   # keep the workers.dev URL alive alongside the custom domains: the form posts to it

# Custom domains (the zone tearexwoodworks.com is in this account).
routes = [
  { pattern = "tearexwoodworks.com", custom_domain = true },
  { pattern = "www.tearexwoodworks.com", custom_domain = true },
]

[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = true       # the Worker routes: www redirect, /api, then static files
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "tearex-contact"
database_id = "8db788b1-17b7-4a4e-8d33-4c6e136fc2b8"


# Email Routing sender (Email Routing is enabled on the zone; MAIL_TO is a verified destination
# address there). Resend, if RESEND_API_KEY is ever set, is the fallback.
[[send_email]]
name = "EMAIL"

[triggers]
crons = ["17 * * * *"]   # hourly: retry any submission whose email didn't go out

[vars]
SITE_URL = "https://tearexwoodworks.com"
CANONICAL_HOST = "tearexwoodworks.com"
ALLOWED_ORIGINS = "https://tearexwoodworks.com,https://www.tearexwoodworks.com,https://tearex-contact.tearexwoodworks.workers.dev,https://m00sey.github.io,http://localhost:8000,http://127.0.0.1:8000"
MAIL_FROM = "Tea Rex Woodworks website <noreply@tearexwoodworks.com>"
MAIL_SUBJECT = "Quote request"
ADMIN_USER = "tearex"

[observability]
enabled = true
