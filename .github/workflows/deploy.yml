# Deploys the site and the form backend (worker/) to Cloudflare on every push to main.
# One-time setup: repo Settings → Secrets → Actions → CLOUDFLARE_API_TOKEN, a token made in the
# Cloudflare dashboard from the "Edit Cloudflare Workers" template with D1 edit added.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          command: deploy
